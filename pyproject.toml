[project]
name = "allox-cli"
version = "0.1.0"
description = "Allox CLI — OpenSandbox lifecycle + AIO sandbox agent tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Allox" }]
keywords = ["agent", "aio", "cli", "opensandbox", "sandbox"]
dependencies = [
    "agent-sandbox>=0.0.18",
    "click>=8.1.0,<9.0",
    "httpx>=0.27.0",
    "opensandbox>=1.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0,<14.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Issues = "https://github.com/AlloxOrg/allox-cli/issues"
Repository = "https://github.com/AlloxOrg/allox-cli"

[project.scripts]
allox-cli = "allox_cli.main:cli"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: requires OpenSandbox server, Docker, and AIO image",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
